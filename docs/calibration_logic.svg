<svg width="800" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  
  <!-- Background -->
  <rect x="10" y="50" width="780" height="830" rx="15" fill="#fcfcfc" stroke="#eee" stroke-width="1" />

  <!-- Title -->
  <text x="400" y="35" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold">Kalibrierungs-Prozess &amp; Schwellenwert-Berechnung</text>

  <!-- Start -->
  <rect x="300" y="70" width="200" height="50" rx="25" fill="#e1f5fe" stroke="#01579b" stroke-width="2" />
  <text x="400" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Start</text>
  
  <line x1="400" y1="120" x2="400" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Phase 1 -->
  <rect x="200" y="160" width="400" height="70" rx="10" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
  <text x="400" y="185" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">Phase 1: Entspannter Zustand (30s)</text>
  <text x="400" y="210" font-family="Arial" font-size="13" text-anchor="middle" fill="#555">Datensammlung Ch1 (Frontal) &amp; Ch8 (Okzipital)</text>
  
  <line x1="400" y1="230" x2="400" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Phase 2 -->
  <rect x="200" y="270" width="400" height="70" rx="10" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
  <text x="400" y="295" font-family="Arial" font-size="15" text-anchor="middle" font-weight="bold">Phase 2: Konzentrierter Zustand (30s)</text>
  
  <line x1="400" y1="340" x2="400" y2="380" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Processing -->
  <rect x="150" y="380" width="500" height="160" rx="10" fill="#f1f8e9" stroke="#388e3c" stroke-width="2" />
  <text x="400" y="410" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Signalverarbeitung (SignalProcessor)</text>
  <text x="170" y="445" font-family="Arial" font-size="14" text-anchor="start">1. Artefakt-Bereinigung (Trimming der Endstücken)</text>
  <text x="170" y="470" font-family="Arial" font-size="14" text-anchor="start">2. Bandpass-Filterung (Alpha &amp; Beta Band)</text>
  <text x="170" y="495" font-family="Arial" font-size="14" text-anchor="start">3. FFT Spektralanalyse (Mittelwert der Magnituden)</text>
  <text x="170" y="520" font-family="Arial" font-size="14" text-anchor="start">4. Verhältnis-Berechnung (Beta / Alpha)</text>
  
  <line x1="400" y1="540" x2="400" y2="580" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Logic calculation -->
  <rect x="175" y="580" width="450" height="130" rx="10" fill="#ede7f6" stroke="#512da8" stroke-width="2" />
  <text x="400" y="610" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Extraktion der Phasen-Verhältnisse</text>
  <text x="200" y="645" font-family="Arial" font-size="14" text-anchor="start" font-weight="bold">ratio_relaxed</text>
  <text x="350" y="645" font-family="Arial" font-size="14" text-anchor="start">= Verhältnis während Entspannung</text>
  <text x="200" y="670" font-family="Arial" font-size="14" text-anchor="start" font-weight="bold">ratio_concentrated</text>
  <text x="350" y="670" font-family="Arial" font-size="14" text-anchor="start">= Verhältnis während Konzentration</text>
  <text x="200" y="695" font-family="Arial" font-size="14" text-anchor="start" font-weight="bold">Differenz</text>
  <text x="350" y="695" font-family="Arial" font-size="14" text-anchor="start">= |ratio_concentrated - ratio_relaxed|</text>

  <line x1="400" y1="710" x2="400" y2="750" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Results -->
  <rect x="100" y="750" width="600" height="110" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" />
  <text x="400" y="780" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Generierte Parameter für Echtzeit</text>
  <text x="130" y="815" font-family="Arial" font-size="15" text-anchor="start" font-weight="bold">Schwellenwert = ratio_relaxed + 0.7 * Differenz</text>
  <text x="130" y="845" font-family="Arial" font-size="15" text-anchor="start" font-weight="bold">Sicherheitsmarge = Differenz * 0.2</text>
  
</svg>
