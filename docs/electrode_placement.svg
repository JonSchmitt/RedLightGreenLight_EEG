<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="600" fill="#ffffff" />
  
  <!-- Head Outline -->
  <circle cx="300" cy="300" r="250" fill="none" stroke="#333" stroke-width="3" />
  
  <!-- Nose -->
  <path d="M 280 50 Q 300 10 320 50" fill="none" stroke="#333" stroke-width="3" />
  
  <!-- Ears -->
  <path d="M 50 280 Q 20 300 50 320" fill="none" stroke="#333" stroke-width="3" />
  <path d="M 550 280 Q 580 300 550 320" fill="none" stroke="#333" stroke-width="3" />

  <!-- 10-20 System Grid (Subtle) -->
  <!-- Horizontal Lines -->
  <path d="M 75 225 Q 300 180 525 225" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />
  <path d="M 50 300 L 550 300" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />
  <path d="M 75 375 Q 300 420 525 375" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />
  
  <!-- Vertical Lines -->
  <path d="M 225 75 Q 180 300 225 525" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />
  <path d="M 300 50 L 300 550" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />
  <path d="M 375 75 Q 420 300 375 525" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5" />

  <!-- Legend -->
  <rect x="20" y="20" width="180" height="60" rx="5" fill="#f9f9f9" stroke="#ccc" />
  <circle cx="40" cy="40" r="8" fill="#4CAF50" />
  <text x="60" y="45" font-family="Arial" font-size="14">Aktive Kanäle (1-8)</text>
  <circle cx="40" cy="65" r="8" fill="#e0e0e0" stroke="#999" stroke-width="1" />
  <text x="60" y="70" font-family="Arial" font-size="14">Inaktive Positionen</text>

  <!-- Electrode Positions -->
  <style>
    .electrode { stroke: #999; stroke-width: 1; }
    .active { fill: #4CAF50; stroke: #2E7D32; stroke-width: 2; }
    .label { font-family: Arial; font-size: 14; font-weight: bold; text-anchor: middle; }
    .chan-num { font-family: Arial; font-size: 16; font-weight: bold; text-anchor: middle; fill: white; }
    .ref-label { font-family: Arial; font-size: 12; fill: #666; text-anchor: middle; }
  </style>

  <!-- Row 1: Frontal -->
  <circle class="electrode" cx="200" cy="150" r="15" fill="#eee" /> <text class="label" x="200" y="130">F3</text>
  <circle class="electrode active" cx="300" cy="150" r="15" /> <text class="label" x="300" y="130">Fz</text> <text class="chan-num" x="300" y="156">1</text>
  <circle class="electrode" cx="400" cy="150" r="15" fill="#eee" /> <text class="label" x="400" y="130">F4</text>

  <!-- Row 2: Central -->
  <circle class="electrode active" cx="200" cy="300" r="15" /> <text class="label" x="200" y="280">C3</text> <text class="chan-num" x="200" y="306">3</text>
  <circle class="electrode active" cx="300" cy="300" r="15" /> <text class="label" x="300" y="280">Cz</text> <text class="chan-num" x="300" y="306">2</text>
  <circle class="electrode active" cx="400" cy="300" r="15" /> <text class="label" x="400" y="280">C4</text> <text class="chan-num" x="400" y="306">4</text>

  <!-- Row 3: Parietal -->
  <circle class="electrode active" cx="200" cy="450" r="15" /> <text class="label" x="200" y="430">P3</text> <text class="chan-num" x="200" y="456">6</text>
  <circle class="electrode active" cx="300" cy="450" r="15" /> <text class="label" x="300" y="430">Pz</text> <text class="chan-num" x="300" y="456">5</text>
  <circle class="electrode active" cx="400" cy="450" r="15" /> <text class="label" x="400" y="430">P4</text> <text class="chan-num" x="400" y="456">7</text>

  <!-- Row 4: Occipital -->
  <circle class="electrode active" cx="300" cy="530" r="15" /> <text class="label" x="300" y="510">Oz</text> <text class="chan-num" x="300" y="536">8</text>

  <!-- Temporal / Others (Optional for context) -->
  <circle class="electrode" cx="100" cy="300" r="15" fill="#eee" /> <text class="label" x="100" y="280">T3</text>
  <circle class="electrode" cx="500" cy="300" r="15" fill="#eee" /> <text class="label" x="500" y="280">T4</text>
  <circle class="electrode" cx="130" cy="180" r="15" fill="#eee" /> <text class="label" x="130" y="160">F7</text>
  <circle class="electrode" cx="470" cy="180" r="15" fill="#eee" /> <text class="label" x="470" y="160">F8</text>
  <circle class="electrode" cx="130" cy="420" r="15" fill="#eee" /> <text class="label" x="130" y="400">T5</text>
  <circle class="electrode" cx="470" cy="420" r="15" fill="#eee" /> <text class="label" x="470" y="400">T6</text>

  <!-- Ground / Ref (Contextual) -->
  <circle cx="300" cy="50" r="10" fill="#bbb" /> <text class="ref-label" x="300" y="40">Nasion</text>
  <circle cx="300" cy="550" r="10" fill="#bbb" /> <text class="ref-label" x="300" y="575">Inion</text>

</svg>
